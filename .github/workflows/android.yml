name: Android native APK
on:
  push:
    branches: [codex/android-arm64-import]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SDL3_SOURCE_DIR: ${{ github.workspace }}/.deps/SDL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.31.6'
      - name: Get matching SDL native and Java sources
        run: |
          git clone --depth 1 --branch release-3.4.14 https://github.com/libsdl-org/SDL.git "$SDL3_SOURCE_DIR"
          test "$(git -C "$SDL3_SOURCE_DIR" rev-parse HEAD)" = '147a8ee32dbf9ac02f3794964490687b6bbda1bc'
      - name: Restore persistent signing key
        env:
          OPENH4_KEYSTORE_BASE64: ${{ secrets.OPENH4_KEYSTORE_BASE64 }}
        run: |
          umask 077
          test -n "$OPENH4_KEYSTORE_BASE64"
          printf '%s' "$OPENH4_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openh4.p12"
      - name: Assemble APK and importer test
        env:
          OPENH4_KEYSTORE: ${{ runner.temp }}/openh4.p12
          OPENH4_KEYSTORE_PASSWORD: ${{ secrets.OPENH4_KEYSTORE_PASSWORD }}
        run: gradle -p android --no-daemon --max-workers=2 assembleDebug assembleDebugAndroidTest lintDebug
      - name: Verify public signing certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/signing.txt
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' android/app/build/signing.txt)
          test "$actual" = "$(cat android/signing-certificate.sha256)"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/openh4.p12"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OpenH4-native-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/reports/lint-results-debug.html
            android/app/build/signing.txt
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: OpenH4-native-debug-${{ github.sha }}
          path: android/app/build
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator launch and native import rejection
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: 7.6in Foldable
          disable-animations: true
          script: bash android/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-diagnostics-${{ github.sha }}
          path: android/smoke-output/
